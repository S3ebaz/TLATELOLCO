<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Las estudiantes también marcharon</title>
<style>
:root{--card:#241c16;--muted:#C4B8A4;--line:rgba(243,235,216,.16);--gold:#D4B36A;--red:#C45C4A}
*{box-sizing:border-box}body{margin:0;background:#14110f;color:#F3EBD8;font-family:Georgia,serif}
.wrap{max-width:1100px;margin:0 auto;padding:1.4rem 1rem 2.4rem}
.date{font-family:'Courier New',monospace;letter-spacing:.16em;font-size:12px;color:var(--gold);text-transform:uppercase;text-align:center}
h1{text-align:center;font-size:2rem;line-height:1.05;margin:.3rem 0 1rem}
.fichas{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.ficha{background:var(--card);border:1px solid var(--line);border-radius:2px;overflow:hidden;color:inherit;text-align:left;padding:0;cursor:pointer;font-family:inherit}
.foto{background:#1a1714;height:210px;overflow:hidden}
.foto img{width:100%;height:100%;object-fit:cover;object-position:center 18%;display:block}
.pad{padding:10px 12px 12px}.n{font-family:'Courier New',monospace;font-size:11px;color:var(--gold)}
h3{margin:.25rem 0 .3rem;font-size:1.05rem;line-height:1.15}.ficha p{margin:0;font-size:.84rem;color:#ddd4c4;line-height:1.35}
.tag{display:inline-block;margin-top:8px;font-family:'Courier New',monospace;font-size:10px;border:1px solid var(--line);padding:2px 6px;color:var(--gold)}
.ficha.active{outline:1px solid var(--gold)}
footer{text-align:center;margin-top:1.4rem;font-family:'Courier New',monospace;font-size:11px;color:var(--muted)}
@media(max-width:900px){.fichas{grid-template-columns:repeat(3,1fr)}}
@media(max-width:640px){.fichas{grid-template-columns:repeat(2,1fr)}h1{font-size:1.6rem}.foto{height:180px}}
</style>
</head>
<body>
<div class="wrap">
<p class="date">2 de octubre · no se olvida</p>
<h1>Las estudiantes también marcharon</h1>
<div class="fichas" id="fichas"></div>
<footer>2 de octubre no se olvida</footer>
</div>
<script>
var WOMEN=[
{n:"01",nombre:"Roberta Avendaño",aka:"La Tita",texto:"Aporte: delegada de Derecho ante el CNH. Encabezó asambleas y actos. Después defendió a otras personas presas y dio clases en el CCH Oriente.",tag:"CNH"},
{n:"02",nombre:"Ana Ignacia Rodríguez",aka:"La Nacha",texto:"Aporte: jefa de finanzas del comité de Derecho y brigadista. Llevó el dinero de la huelga y, años después, siguió en el Comité del 68.",tag:"Finanzas"},
{n:"03",nombre:"Myrthokleia González",aka:"",texto:"Aporte: una de las mujeres del CNH. El 2 de octubre condujo el mitin desde el balcón del edificio Chihuahua.",tag:"Mitin"},
{n:"04",nombre:"Marcia Gutiérrez",aka:"",texto:"Aporte: delegada de Odontología. Su nombre se votó para conducir el mitin de esa tarde, junto al de Myrthokleia.",tag:"CNH"},
{n:"05",nombre:"Adriana Corona",aka:"",texto:"Aporte: delegada de la Prepa 6 ante el CNH. Representó a su escuela y salió a la plaza esa tarde.",tag:"CNH"},
{n:"06",nombre:"María Eugenia Espinosa",aka:"",texto:"Aporte: voz en las asambleas y en la difusión de las demandas del pliego.",tag:"Asamblea"},
{n:"07",nombre:"Martha Servín",aka:"",texto:"Aporte: representante. Organizó el trabajo de calle: volantes, mantas y brigadas.",tag:"Brigada"},
{n:"08",nombre:"Amada Velasco",aka:"",texto:"Aporte: estudiante de Derecho. Sostuvo el movimiento y fue de las cuatro mujeres presas dos años en Santa Martha.",tag:"Santa Martha"},
{n:"09",nombre:"Adela Salazar",aka:"",texto:"Aporte: abogada del comité de familiares. Apoyó a madres y padres, y también estuvo en Santa Martha.",tag:"Familias"},
{n:"10",nombre:"Elsa Lecuona",aka:"",texto:"Aporte: brigadista. Explicó el pliego en la calle y dejó dicho que ellas también se la jugaron.",tag:"Brigada"},
{n:"11",nombre:"Silvia Gálvez",aka:"",texto:"Aporte: a los 15 años repartía volantes. Participó en la marcha del silencio del 13 de septiembre.",tag:"Brigada"},
{n:"12",nombre:"Justina Lory Méndez",aka:"",texto:"Aporte: fotografió a las mujeres en marchas y asambleas. Su colección está en el archivo de la UNAM.",tag:"Archivo"},
{n:"13",nombre:"Ana Ortiz y Esther Montero",aka:"",texto:"Aporte: reunieron volantes, manifiestos y fotografías para que el movimiento no se perdiera.",tag:"Archivo"},
{n:"14",nombre:"Ethel Villanueva",aka:"",texto:"Aporte: fotografió el mural efímero de la explanada de Ciudad Universitaria.",tag:"Fotos"},
{n:"15",nombre:"Elena Poniatowska",aka:"",texto:"Aporte: recogió voces de estudiantes y publicó La noche de Tlatelolco, el testimonio más leído del 68.",tag:"Testimonio"},
{n:"16",nombre:"Ifigenia Martínez",aka:"",texto:"Aporte: profesora que se sumó al movimiento y acompañó a las y los estudiantes.",tag:"Profesora"}
];
var box=document.getElementById("fichas");
WOMEN.forEach(function(w){
 var b=document.createElement("button"); b.className="ficha";
 var foto=document.createElement("div"); foto.className="foto";
 var img=document.createElement("img"); img.alt=w.nombre; img.src="r/"+w.n+".jpg";
 foto.appendChild(img);
 var pad=document.createElement("div"); pad.className="pad";
 pad.innerHTML='<div class="n">16 · '+w.n+'</div><h3>'+w.nombre+(w.aka?'<br>'+w.aka:'')+'</h3><p>'+w.texto+'</p><span class="tag">'+w.tag+'</span>';
 b.appendChild(foto); b.appendChild(pad); box.appendChild(b);
});
</script>
</body>
</html>
